{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div style="max-width: 40rem;">
<h1>Add Product</h1>
<p class="page-subtitle">Fill in the details of the new product.</p>
{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
<div class="card"><div class="card-body p-4">
<form method="POST" action="{{ url_for('add_product') }}">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" maxlength="100" value="{{ request.form.get('name', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">SKU</label>
        <input type="text" class="form-control" name="sku" maxlength="50" value="{{ request.form.get('sku', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" step="0.01" min="0" max="1000000" class="form-control" name="price" value="{{ request.form.get('price', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" min="0" max="1000000" class="form-control" name="quantity" value="{{ request.form.get('quantity', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" name="category" maxlength="50" value="{{ request.form.get('category', '') }}">
    </div>
    <button type="submit" class="btn btn-primary">Add Product</button>
    <a href="{{ url_for('products') }}" class="btn btn-light-subtle">Cancel</a>
</form>
</div></div>
</div>
{% endblock %}
