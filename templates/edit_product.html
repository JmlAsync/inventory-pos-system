{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div style="max-width: 40rem;">
<h1>Edit Product</h1>
<p class="page-subtitle">Change the details and save.</p>
{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
<div class="card"><div class="card-body p-4">
<form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" maxlength="100" value="{{ product.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">SKU</label>
        <input type="text" class="form-control" name="sku" maxlength="50" value="{{ product.sku }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" step="0.01" min="0" max="1000000" class="form-control" name="price" value="{{ product.price }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" min="0" max="1000000" class="form-control" name="quantity" value="{{ product.quantity }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" name="category" maxlength="50" value="{{ product.category or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('products') }}" class="btn btn-light-subtle">Cancel</a>
</form>
</div></div>
</div>
{% endblock %}
